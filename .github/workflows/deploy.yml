name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      # 1. main 브랜치 체크아웃 및 Svelte 빌드
      - name: Checkout main (Svelte)
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies (Svelte)
        run: pnpm install --frozen-lockfile

      - name: Build Svelte site
        run: pnpm build

      # 2. react 브랜치를 하위 폴더(react-app)로 체크아웃 및 빌드
      - name: Checkout react branch
        uses: actions/checkout@v4
        with:
          ref: react
          path: react-app

      - name: Build React site
        working-directory: react-app
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      # 3. React 빌드 산출물(dist)을 Svelte 정적 산출물(build)의 /react 폴더로 병합
      - name: Merge React build into Svelte build
        run: |
          mkdir -p build/react
          cp -r react-app/dist/* build/react/

      # 4. GitHub Pages 아티팩트 업로드 및 배포
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'build'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4